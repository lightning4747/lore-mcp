[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore-mcp"
version = "0.1.0"
description = "Series-agnostic, context-aware lore retrieval MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
server = [
    "fastmcp>=0.4.0",
    "uvicorn>=0.30.0",
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",
    "upstash-redis>=1.0.0",
]
ingest = [
    "qdrant-client>=1.9.0",
    "beautifulsoup4>=4.12.0",
    "tavily-python>=0.3.0",
    "srt>=3.5.0",
    "mwclient>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "pre-commit>=3.7.0",
    "import-linter>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = [
    "src/lore_mcp/domain",
    "src/lore_mcp/ports",
    "src/lore_mcp/application",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, no external I/O)",
    "contract: Contract tests for port abstractions",
    "integration: Integration tests with databases / services",
    "e2e: End-to-end scenario tests",
    "live: Live external network calls (Qdrant Cloud, Upstash, Tavily)",
]
addopts = "-ra --strict-markers"
